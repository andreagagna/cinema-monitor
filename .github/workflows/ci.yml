name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional start DATE override (YYYY-MM-DD)"
        required: false
        type: string
      horizon_days:
        description: "Optional HORIZON_DAYS override"
        required: false
        type: string
      min_score:
        description: "Optional MIN_SCORE override (e.g. 0.8)"
        required: false
        type: string
  schedule:
    # GitHub Actions schedules use UTC (Prague winter time CET = UTC+1):
    # - Tue & Wed mornings: every 30 min from 07:00 to 12:30 Prague CET (06:00-11:30 UTC)
    - cron: "*/30 6-11 * * 2,3"
    # - Mon, Thu & Fri: daily noon check at 12:00 Prague CET (11:00 UTC)
    - cron: "0 11 * * 1,4,5"

jobs:
  lint-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Black
        run: uv run black --check .
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest

  run-monitor:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore latest screening date state
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cinema-monitor
          key: cinema-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cinema-monitor-state-
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Sync dependencies
        run: uv sync
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Run cinema-monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATE: ${{ inputs.date }}
          HORIZON_DAYS: ${{ inputs.horizon_days }}
          MIN_SCORE: ${{ inputs.min_score }}
        run: uv run cinema-monitor
      - name: Save latest screening date state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.local/share/cinema-monitor
          key: cinema-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
